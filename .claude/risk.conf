# Configuração do harness para o próprio repositório do wstack: o plugin está ativo nas sessões daqui
# (.claude/settings.json), e os hooks dele leem este arquivo. Por enquanto, só as branches; sem verify_*, o Stop não
# roda a verificação (os testes do plugin rodam no CI).
default_branch = main
activity_branch = claude/
activity_branch = chore/
activity_branch = feat/
activity_branch = fix/
