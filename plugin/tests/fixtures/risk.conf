# risk.conf de referência dos testes dos hooks: as chaves de branch e os caminhos críticos do harness do modelo de
# projeto. Os testes o versionam no commit base de cada repositório temporário, como num projeto real (os hooks e scripts
# leem o do projeto, não um da pasta do plugin).
critical = .claude/settings.json
critical = .claude/risk.conf
critical = .claude/cloud/*
default_branch = main
activity_branch = chore/
activity_branch = feat/
activity_branch = fix/
activity_branch = task/
activity_branch = claude/
