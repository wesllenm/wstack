# Hosts que o setup.sh da nuvem e as ferramentas de cada stack acessam: a lista para liberar na rede do ambiente da nuvem.
# Fonte única: o setup.sh imprime só os das stacks detectadas (--plan e no fim da instalação) e o --check aponta o que o
# proxy recusou. Modelo do /wstack:bootstrap; o projeto acrescenta os hosts que só ele usa (registro privado, imagem de
# outro registro). A documentação consultada pelas skills vem dos WebFetch(domain:...) do .claude/settings.json, não daqui.
# Formato: <stack> <host> <documentação oficial que cita o host>. Host repetido em outra stack é a rota de imagem dela
# (o setup copia da imagem oficial quando o instalador é recusado).
# Stacks: dotnet, node, playwright, rust, python, go, docker (compose, Testcontainers, cloud_pull/cloud_extract; só o
# Docker Hub: imagem de outro registro precisa do host dele, acrescentado aqui na stack docker) e wstack (o plugin na
# versão fixada no .claude/settings.json, clonado do GitHub pelo claude plugin).

