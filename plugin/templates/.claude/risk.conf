# Configuração do workflow do wstack neste projeto: classificador de risco (classify-diff.sh do plugin) e parâmetros dos
# hooks e scripts do plugin. Gerado pelo /wstack:bootstrap; o projeto mantém. Sem este arquivo o classificador devolve
# CRITICA para tudo e os hooks de workflow ficam inertes (docs/decisions.md do wstack, plugin inerte sem risk.conf).
# Formato: "chave = valor", uma por linha; comentário sempre em linha própria (o classificador não o corta).
# Globs no formato do `case` do bash, relativos à raiz do repositório ("*" casa também "/").
#
# caminhos críticos: qualquer toque leva ao nível CRITICA (autenticação, autorização, segredos e tokens, dados pessoais,
# orçamento e custo de IA, migrations, contratos públicos). O bootstrap preenche com os do projeto, por exemplo:
# critical = src/*/Auth/*
# critical = */Migrations/*
# critical = src/*/Contracts/*
# critical = *appsettings*.json
# defesas do próprio workflow: permissões, classificador, setup da nuvem (roda como root a cada sessão), instruções que
# toda sessão carrega e o complemento da rubrica de revisão. Sem isto, afrouxar o workflow sai TRIVIAL ou SIMPLES e não
# aciona security-agent nem review-critical.
critical = .claude/settings.json
critical = .claude/risk.conf
critical = .claude/cloud/*
critical = .claude/agents/*
critical = .github/workflows/*
critical = CLAUDE.md
critical = docs/review-rubric.md
# sinais opcionais, por convenção de pasta e tipo de arquivo (lista e padrões no classify-diff.sh); ligar só os que se
# aplicam e calibrar no histórico com calibrate-risk.sh
# critical_signal = dependency-lockfile
# critical_signal = authentication
# critical_signal = authorization
# critical_signal = database-migration
# critical_signal = infrastructure
# critical_signal = secrets
# critical_signal = payment
# critical_signal = public-api-contract
# caminhos complexos: qualquer toque leva a COMPLEXA (regras do projeto que pedem plano completo: máquina de estados,
# orquestração versionada, adaptadores de entrada)
# complex = src/Orders/Workflow/*
# raízes de domínio: mais de um domínio tocado leva a COMPLEXA (as mesmas da tabela Domínios de .claude/project.md)
# domain = src/Orders/*
# caminhos quentes de performance: glob -> categoria de benchmark (skill performance, camada 3); só depois de existir o
# comando bench da categoria (sem ele, a categoria sai SEM BENCHMARK)
# hot = src/Orders/Pricing/* -> Pricing
# bench = Pricing -> <comando que grava o TSV comum em "$BENCH_TSV">
# profile = Pricing -> <comando que grava o resumo do perfil em "$BENCH_PROFILE_OUT">
# budget = total:js -> 250000
# referência do diff: HEAD = mudanças ainda não commitadas (a tarefa em curso); tarefa já commitada: classify-diff.sh <commit>
base = HEAD
max_files_trivial = 3
max_lines_trivial = 50
max_files_simple = 5
max_lines_simple = 200
# edições sem commit até o iteration-guard devolver a regra das três tentativas; 0 desliga
iteration_limit = 40
#
# gates do Stop (verify-on-stop.sh do plugin): o arquivo que existe quando há o que compilar e os comandos de build,
# formato (vazio, não roda) e testes rápidos. Sem verify_solution, verify_build e verify_test, o gate de verificação não
# roda. O bootstrap preenche com os comandos do CLAUDE.md, por exemplo:
# verify_solution = App.slnx
# verify_build = dotnet build App.slnx
# verify_lint = dotnet format App.slnx --verify-no-changes
# verify_test = dotnet test App.slnx --filter "Category!=Integration&Category!=E2E"
#
# travas de permissão, lidas pelos hooks do plugin (push-guard, protected-paths, path-guard)
# default_branch: recusada no push (main e master também, embutidas) e base do que o push publica (merge-base com
# origin/<default_branch>; sem a chave, main)
default_branch = main
# activity_branch: prefixo (terminado em /) das branches de atividade que o push-guard libera; vale só letra, dígito,
# ponto, hífen e sublinhado, começando por letra ou dígito; refs/, heads/, tags/ e remotes/ (em qualquer caixa) são
# ignorados. O ccr-<id>-<id> da nuvem e o wip/ do checkpoint são embutidos. Mudam junto com o "git push -u origin
# <prefixo>*" do allow do .claude/settings.json.
activity_branch = chore/
activity_branch = feat/
activity_branch = fix/
activity_branch = task/
activity_branch = claude/
# protected: o que um push ou checkpoint só publica com aprovação, além do núcleo fixo nos hooks (.claude/hooks, scripts,
# agents, skills, cloud, settings, risk.conf, .github, .gitattributes/.gitmodules/.gitignore, .mcp.json); só ACRESCENTA.
# Glob relativo à raiz, sem diferenciar caixa: só "*" (casa também "/") e "?" são curingas; um comentário no fim da
# linha faria parte do glob. risk.conf ilegível faz o push e o checkpoint pedirem.
# protected = ci/*
# protected = .devcontainer/*
# allow_module: forma fechada de comando que o path-guard libera, de hooks/<nome>-allow.mjs do plugin (.NET: dotnet);
# com dotnet, o hook dotnet-allow também a aprova sem pedido (o deny e o ask do settings.json continuam valendo);
# sem a declaração a forma cai na regra geral; módulo declarado que não carrega faz todo comando pedir.
# allow_module, review_exclude e smell_exclude são exceções: afrouxam um gate e só valem com motivo e vencimento
# ("| vence: AAAA-MM-DD | motivo: <texto>"); sem data, vencida ou sem motivo, é ignorada e o SessionStart avisa
# allow_module = dotnet | vence: AAAA-MM-DD | motivo: formas fechadas do dotnet
#
# sinais de qualidade do diff (quality-signals.sh): produtor -> comando que grava em $QUALITY_OUT
# quality = cobertura -> dotnet test --no-restore --collect:"XPlat Code Coverage" --results-directory "$QUALITY_OUT"
# quality = jscpd -> npx jscpd --silent --gitignore --min-tokens 50 --reporters json --output "$QUALITY_OUT" src
crap_threshold = 30
crap_info = 10
# despacho da revisão (review-dispatch.mjs): checklist por caminho (vale a primeira que casar; o arquivo fica no
# projeto e precisa existir), exclusões e resgates da lista padrão de gerados
# review_rule = **/Migrations/*.cs -> docs/review/migrations.md
# review_exclude = docs/generated/** | vence: AAAA-MM-DD | motivo: <por que não vai a revisor>
# review_include = src/Contracts/*.g.cs
review_group_threshold = 5
review_group_max = 10
review_group_max_lines = 400
review_max_file_lines = 1500
# válvulas de escape e comentários nas linhas adicionadas (diff-smells.mjs)
smell_escape_limit = 0
smell_comment_limit = 3
# smell_exclude = **/Interop/** | vence: AAAA-MM-DD | motivo: <por que não passa pelo diff-smells>
# interrogatório do diff por modelos de outro fornecedor (interrogate.mjs, revisão de COMPLEXA e CRITICA): um por
# modelo, "<nome> <comando>"; o comando roda com bash -c na raiz, lê o pedido da entrada padrão e escreve a resposta na
# saída padrão. O pacote de revisão sai da máquina para o fornecedor: ligar é decisão do projeto, registrada em
# docs/decisions.md. Configurar a CLI sem ferramentas de escrita nem de execução (o diff pode trazer texto hostil) e a
# chave dela fora do repositório.
# interrogate_cmd = <nome> <CLI do fornecedor em modo não interativo, lendo da entrada padrão>
# interrogate_timeout = 600
# modo paralelo assistido: faixa de portas por worktree e vida do registro de sessão
worktree_port_base = 20000
worktree_port_step = 10
worktree_slots = 8
session_stale_hours = 8
# superfície do usuário para o aviso de mapa de features desatualizado (map-staleness.mjs); o bootstrap preenche ao
# gerar a skill verify-<app>
# feature_surface = src/**/Endpoints/**
# checagem do arquivo recém-editado (edit-check.sh, PostToolUse); {file} vira o caminho
# edit_check = *.cs -> dotnet format whitespace --folder --verify-no-changes --include {file}
# edit_check_timeout = 60
# testes da área tocada antes do commit e ao concluir tarefa (checkpoint-tests.sh); prazo por comando e orçamento total
# do hook, abaixo do timeout dele no hooks.json do plugin (900 s), para o commit não seguir sem checkpoint
# checkpoint = src/Orders/* -> dotnet test tests/Orders.Tests --no-restore
# checkpoint_timeout = 600
# checkpoint_budget = 840
# sessões na nuvem (cloud-services.sh e setup.sh do plugin): serviços a subir, quando estão prontos, imagens para o
# snapshot (só o que falta: o Docker Hub anônimo responde 429 ao IP compartilhado da VM)
# cloud_service = docker compose -f compose.dev.yml up -d db
# cloud_ready = docker compose -f compose.dev.yml exec -T db pg_isready
# cloud_ready_timeout = 180
# cloud_pull = docker image inspect postgres:16 > /dev/null 2>&1 || docker pull -q postgres:16
# binário que só existe em imagem (caminhos absolutos ou ~); trocar a imagem reextrai
# cloud_extract = <imagem>:<tag> /<binário> -> ~/.local/bin
# destinos dos documentos (doc-paths.mjs do plugin): sem a chave, o caminho padrão; o projeto que já tem lugar para o
# fato aponta a chave em vez de manter dois arquivos. Caminho relativo à raiz, sem "..". O SessionStart lista os
# destinos trocados e avisa valor inválido ou arquivo ausente. Com doc_state, a pendência e o "onde paramos" vão para
# esse arquivo versionado, e o .claude/SESSION.md fica só com o estado local da sessão.
# doc_decisions = docs/decisions.md
# doc_gotchas = docs/gotchas.md
# doc_gotchas_dir = docs/gotchas
# doc_calibration = docs/review-calibration.md
# doc_rubric = docs/review-rubric.md
# doc_state = docs/onde-paramos.md
# skills e agentes do plugin que o projeto substitui pelos dele (overrides.mjs do plugin), uma linha por item: a lead
# chama e carrega a versão do projeto pelo nome sem prefixo. Skill pode ter outro nome no projeto; agente, só o mesmo
# nome. O Claude Code não desliga um item do plugin: os dois continuam listados. O SessionStart lista as trocas e avisa
# item do projeto com o mesmo nome de um do plugin sem override (os agentes do plugin já pré-carregam a skill dele).
# override = tdd
# override = review-agent
# override = test-audit -> revisao-de-testes
# repositórios que mudam junto com este na mesma tarefa (companions.mjs do plugin), um por linha, caminho relativo à
# raiz (o irmão: ../<nome>). Cada um precisa do próprio .claude/risk.conf, que vale para ele. A lead classifica a
# tarefa com classify-diff.sh --companions (o maior nível; COMPLEXA quando mais de um muda código), o Stop roda os
# verify_* de cada um e o checkpoint-tests usa o risk.conf do repositório do commit.
# companion = ../<outro repositório>
